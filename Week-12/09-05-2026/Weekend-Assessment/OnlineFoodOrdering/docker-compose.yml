services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foodordering-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "FoodRush@2025"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=FoodOrderingDb;User Id=sa;Password=FoodRush@2025;TrustServerCertificate=True;
    depends_on:
      - sqlserver

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=FoodOrderingDb;User Id=sa;Password=FoodRush@2025;TrustServerCertificate=True;
    depends_on:
      - sqlserver

volumes:
  sqldata: