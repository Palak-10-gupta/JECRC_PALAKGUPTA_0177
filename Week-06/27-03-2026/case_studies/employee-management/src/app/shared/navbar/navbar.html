
<nav class="navbar">
  <div class="navbar-brand">
    <span class="brand-icon">👥</span>
    <span class="brand-name">EmpManager</span>
  </div>
  <div class="navbar-links">
    @if (authService.isAuthenticated()) {
      <a routerLink="/employees" routerLinkActive="active">Employees</a>

</nav>
