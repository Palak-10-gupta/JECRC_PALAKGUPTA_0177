
<div class="page-container">
  <div class="card form-card">
    <h2>✏️ Edit Employee</h2>

    @if (errorMsg) {
      <div class="alert-error">{{ errorMsg }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="Full Name" required />
      </div>
      <div class="form-group">
        <label>Role / Designation</label>
        <input type="text" [(ngModel)]="role" name="role" placeholder="Role" required />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-warning">Update Employee</button>
        <a routerLink="/employees" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
