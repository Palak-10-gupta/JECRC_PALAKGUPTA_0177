<!-- src/app/employee/employee-list/employee-list.html -->
<div class="page-container">
  <div class="card">
    <div class="list-header">
      <h2>👥 Employees</h2>
      <a routerLink="/employees/add" class="btn btn-success">+ Add Employee</a>
    </div>

    <div class="search-bar">
      <input type="text" [(ngModel)]="searchQuery" (input)="search()"
             placeholder="🔍  Search by name or role..." />
    </div>

    @if (employees.length === 0) {
      <div class="empty-state">No employees found.</div>
    }

    <div class="emp-table-wrapper">
      <table class="emp-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (emp of employees; track emp.id; let i = $index) {
            <tr>
              <td>{{ i + 1 }}</td>
              <td>{{ emp.name }}</td>
              <td><span class="role-badge">{{ emp.role }}</span></td>
              <td class="actions">
                <a [routerLink]="['/employees/view', emp.id]" class="btn btn-info">View</a>
                <a [routerLink]="['/employees/edit', emp.id]" class="btn btn-warning">Edit</a>
                <button (click)="delete(emp.id)" class="btn btn-danger">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
