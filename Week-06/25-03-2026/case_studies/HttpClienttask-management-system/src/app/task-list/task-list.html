<div class="container">

  <h2>Task Manager</h2>

  <div class="top-bar">
    <input [(ngModel)]="searchTerm" placeholder="Search task..." />
    <button (click)="search()">Search</button>
    <button class="add-btn" (click)="addNew()">Add Task</button>
  </div>

  <!-- ⭐ FORM SHOULD BE HERE -->
  <app-task-form
    *ngIf="showForm"
    [task]="selectedTask"
    (close)="formClosed($event)">
  </app-task-form>

  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Status</th>
      <th>Action</th>
    </tr>

    <tr *ngFor="let task of tasks">
      <td>{{task.id}}</td>

      <td [class.done]="task.completed">
        {{task.title}}
      </td>

      <td>
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleStatus(task)"
        />
      </td>

      <td>
        <button (click)="editTask(task)">Edit</button>
        <button class="delete" (click)="deleteTask(task.id)">
          Delete
        </button>
      </td>
    </tr>
  </table>

</div>
