<div class="form-box">

  <h3>{{model.id ? 'Edit Task' : 'Add Task'}}</h3>

  <label>Title</label>
  <input [(ngModel)]="model.title" />

  <label>
    <input type="checkbox" [(ngModel)]="model.completed" />
    Completed
  </label>

  <div class="buttons">
    <button (click)="save()">Save</button>
    <button class="cancel" (click)="cancel()">Cancel</button>
  </div>

</div>
