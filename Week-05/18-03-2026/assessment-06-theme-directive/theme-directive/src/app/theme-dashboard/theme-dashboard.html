<div class="page" [appTheme]="currentTheme">

  <h2 class="title">🎨 Theme Switch Dashboard</h2>

  <div class="center">

    <button class="toggle"
            (click)="toggleTheme()">

      Switch to {{ currentTheme === 'light'
                    ? 'Dark Mode'
                    : 'Light Mode' }}

    </button>

  </div>

  <div class="cards">

    <div class="card">
      Dashboard Overview
    </div>

    <div class="card">
      Reports Section
    </div>

    <div class="card">
      Settings Panel
    </div>

  </div>

</div>
