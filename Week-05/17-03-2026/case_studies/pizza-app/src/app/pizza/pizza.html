<h2> Welcome to Pizza Application !</h2>

<label>Pizza Name:</label>
<input type = "text" [(ngModel)]="pizzaName">

<br><br>

<label>Quantity:</label>
<input type="number" [(ngModel)]="quantity">

<br><br>

<br><br>

<label class="addr">Delivery Address:</label>
<textarea [(ngModel)]="address"></textarea>

<hr>

<h3>Order Summary</h3>

<p>Pizza: {{pizzaName}}</p>
<p>Quantity: {{quantity}}</p>
<p>Address: {{address}}</p>
